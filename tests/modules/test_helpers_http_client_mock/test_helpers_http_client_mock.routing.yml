test_helpers_http_client_mock.set_test_name:
  path: '/test-helpers-http-client-mock/set-settings'
  defaults:
    _controller: 'Drupal\test_helpers_http_client_mock\Controller\HttpClientMockController::setSettings'
  requirements:
    # We need to make this endpoint available for all to simplify tests.
    _access: 'TRUE'
  options:
    no_cache: 'TRUE'

